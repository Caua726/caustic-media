<!-- A private session bus for tests that starts none of the desktop's
     services: only those in services/, which start nothing but leave a mark
     (dbus/tools/run_dbus_bare.sh). A test then knows whether something
     asked for one of them to be started. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <servicedir>services</servicedir>
  <!-- The stand-ins never take their names: their start given up on soon. -->
  <limit name="service_start_timeout">500</limit>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
