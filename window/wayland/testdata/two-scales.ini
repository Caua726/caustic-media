# Two outputs side by side, the second at twice the scale of the first: a
# window moved from one to the other changes scale (subsurface_test scales).
[shell]
panel-position=none
# Nothing drawn in between: what is read back is the window as committed.
animation=none
close-animation=none
startup-animation=none
focus-animation=none

[output]
name=X1
mode=640x480
scale=1

[output]
name=X2
mode=640x480
scale=2
